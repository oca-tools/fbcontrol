<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FBControl · Conceito — Componentes base</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>body{margin:0;padding:24px;background:#DEDEDD;font-family:'Montserrat',system-ui,sans-serif}.wrap{max-width:820px;margin:0 auto}h1{font-size:18px;font-weight:600;color:#252525;margin:0 0 4px}.sub{font-size:13px;color:#7A7A79;margin:0 0 18px}</style>
</head>
<body>
<div class="wrap">
<h1>Componentes base</h1>
<p class="sub">Botões (hierarquia + estados), badges (3 famílias), campos e stepper.</p>
<div style="background:#F4F4F3;border-radius:14px;padding:1.25rem;color:#252525">
  <p style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9A9A99;font-weight:600;margin:0 0 10px">Botões · 1 primário por tela</p>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px">
    <button style="background:#15B1C9;color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:0.85rem;font-weight:600;font-family:inherit;box-shadow:0 1px 2px rgba(21,177,201,.3)">Ação primária</button>
    <button style="background:#fff;color:#252525;border:1px solid #DcDcDb;border-radius:9px;padding:10px 16px;font-size:0.85rem;font-weight:600;font-family:inherit">Secundário</button>
    <button style="background:transparent;color:#7A7A79;border:0;border-radius:9px;padding:10px 14px;font-size:0.85rem;font-weight:600;font-family:inherit">Fantasma</button>
    <button style="background:#FBE9E7;color:#8F312B;border:0;border-radius:9px;padding:10px 16px;font-size:0.85rem;font-weight:600;font-family:inherit">Perigo</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 20px">
    <button style="background:#0E93A8;color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:0.85rem;font-weight:600;font-family:inherit">hover</button>
    <button style="background:#15B1C9;color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:0.85rem;font-weight:600;font-family:inherit;transform:scale(.97)">active</button>
    <button style="background:#15B1C9;color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:0.85rem;font-weight:600;font-family:inherit;opacity:.45">disabled</button>
    <button style="background:#15B1C9;color:#fff;border:0;border-radius:9px;padding:10px 22px;font-size:0.85rem;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:7px"><i class="ti ti-loader-2"></i> loading</button>
  </div>
  <p style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9A9A99;font-weight:600;margin:0 0 10px">Badges · 3 famílias</p>
  <div style="display:flex;flex-direction:column;gap:8px;margin:0 0 20px">
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
      <span style="font-size:0.7rem;color:#9A9A99;width:70px">status</span>
      <span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:#E6F5EE;color:#2E9E6B">ok</span>
      <span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:#FBF0DC;color:#C77A12">fora de horário</span>
      <span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:#FBE9E7;color:#8F312B">duplicado</span>
      <span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:#ECE9F7;color:#524399">múltiplo</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
      <span style="font-size:0.7rem;color:#9A9A99;width:70px">contagem</span>
      <span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EDEDEC;color:#252525">12</span>
      <span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EDEDEC;color:#252525">+5</span>
      <span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#FBEFE6;color:#C9641F">3 novos</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
      <span style="font-size:0.7rem;color:#9A9A99;width:70px">identidade</span>
      <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#E4F1F7;color:#215A73"><i class="ti ti-droplet" style="font-size:12px"></i> Corais</span>
      <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EAF3E4;color:#3A6A2C"><i class="ti ti-leaf" style="font-size:12px"></i> Giardino</span>
      <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#ECE9F7;color:#524399"><i class="ti ti-star" style="font-size:12px"></i> IX'u</span>
    </div>
  </div>
  <p style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9A9A99;font-weight:600;margin:0 0 10px">Campos</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
    <div>
      <label style="font-size:0.72rem;color:#7A7A79;display:block;margin:0 0 4px">Titular</label>
      <div style="background:#fff;border:1px solid #DcDcDb;border-radius:9px;padding:10px 12px;font-size:0.85rem;color:#252525">Fam. Silva</div>
    </div>
    <div>
      <label style="font-size:0.72rem;color:#7A7A79;display:block;margin:0 0 4px">UH (foco)</label>
      <div style="background:#fff;border:2px solid #15B1C9;border-radius:9px;padding:9px 12px;font-size:0.85rem;box-shadow:0 0 0 3px rgba(21,177,201,.16)">1203</div>
    </div>
    <div>
      <label style="font-size:0.72rem;color:#7A7A79;display:block;margin:0 0 4px">PAX (stepper)</label>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:34px;height:34px;border:1px solid #DcDcDb;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff"><i class="ti ti-minus"></i></span>
        <span style="font-size:1.1rem;font-weight:700;min-width:18px;text-align:center">4</span>
        <span style="width:34px;height:34px;border:1px solid #DcDcDb;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff"><i class="ti ti-plus"></i></span>
      </div>
    </div>
  </div>
</div>
</div>
</body>
</html>
